name: Deploy NEXA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and quiz generator
        run: |
          node --check script.js
          node --check quiz-live.js
          node --check quiz-bootstrap.js
          node - <<'NODE'
          const fs = require('fs');
          const bootstrap = fs.readFileSync('quiz-bootstrap.js', 'utf8');
          const indexHtml = fs.readFileSync('index.html', 'utf8');
          const quizLive = fs.readFileSync('quiz-live.js', 'utf8');

          if (!/window\.nexaQuizOpen = openQuiz;/.test(quizLive)) throw new Error('Quiz integration: função pública de abertura ausente');
          if (/const bindQuizButton = \(\)/.test(quizLive)) throw new Error('Quiz integration: binding antigo duplicado');
          if (!/document\.addEventListener\('click', handleClick, true\)/.test(bootstrap)) throw new Error('Quiz integration: captura de clique ausente');
          if (!/type="button" id="aiQuizButton"/.test(indexHtml)) throw new Error('Quiz integration: botão sem type=button');
          if (!/quiz-live\.js\?v=20260924-fix-button-5/.test(indexHtml)) throw new Error('Quiz integration: cache-bust incorreto');
          if (!/quiz-bootstrap\.js\?v=20260924-bootstrap-1/.test(indexHtml)) throw new Error('Quiz integration: bootstrap não carregado');
          if ((indexHtml.match(/id="aiQuizButton"/g) || []).length !== 1) throw new Error('Quiz integration: botão duplicado');
          if ((indexHtml.match(/id="quizDialog"/g) || []).length !== 1) throw new Error('Quiz integration: dialog duplicado');
          console.log('Quiz integration static checks OK');
          NODE
          node - <<'NODE'
          global.window = { document: null };
          require('./quiz-live.js');

          const normal = 'A Revolução Francesa foi um processo político e social ocorrido na França no final do século XVIII. A burguesia defendia maior participação política e liberdade econômica. A queda da Bastilha ocorreu em 14 de julho de 1789. A Declaração dos Direitos do Homem e do Cidadão defendia liberdade e igualdade jurídica. A Revolução provocou mudanças profundas na política europeia. O movimento também influenciou outras sociedades.';
          const quiz = window.nexaQuizEngine.generateQuizFromText(normal, 6);
          if (quiz.length !== 6) throw new Error('Quiz test: quantidade incorreta');
          if (quiz.some(q => q.alternatives.length !== 4)) throw new Error('Quiz test: questão sem 4 alternativas');
          if (quiz.some(q => !q.alternatives.includes(q.answer))) throw new Error('Quiz test: resposta correta ausente');
          if (quiz.some(q => !q.explanation || !q.explanation.includes('resumo'))) throw new Error('Quiz test: explicação ausente');
          if (new Set(quiz.map(q => q.question)).size !== quiz.length) throw new Error('Quiz test: perguntas repetidas');

          const fakePdf = [
            {str:'P',transform:[10,0,0,10,0,100],width:5},
            {str:'e',transform:[10,0,0,10,6,100],width:5},
            {str:'d',transform:[10,0,0,10,12,100],width:5},
            {str:'r',transform:[10,0,0,10,18,100],width:5},
            {str:'o',transform:[10,0,0,10,24,100],width:5},
            {str:'I',transform:[10,0,0,10,36,100],width:5},
            {str:'foi',transform:[10,0,0,10,48,100],width:14},
            {str:'imperador',transform:[10,0,0,10,66,100],width:50},
            {str:'do',transform:[10,0,0,10,122,100],width:12},
            {str:'Brasil',transform:[10,0,0,10,139,100],width:30},
            {str:'A',transform:[10,0,0,10,0,84],width:5},
            {str:'queda',transform:[10,0,0,10,12,84],width:28},
            {str:'da',transform:[10,0,0,10,45,84],width:10},
            {str:'Bastilha',transform:[10,0,0,10,58,84],width:38},
            {str:'ocorreu',transform:[10,0,0,10,101,84],width:35},
            {str:'em',transform:[10,0,0,10,141,84],width:10},
            {str:'1789.',transform:[10,0,0,10,155,84],width:28}
          ];
          const pdfText = window.nexaQuizEngine.assemblePdfText(fakePdf);
          if (!/Pedro I foi imperador do Brasil/.test(pdfText)) throw new Error('PDF test: texto com letras separadas não foi reconstruído');
          if (!pdfText.includes('\n')) throw new Error('PDF test: quebras de linha perdidas');

          const sample = `Eixo econômico mudou do Nordeste (açúcar) para o Centro-Sul (Minas Gerais).
Povoamento do interior → fronteiras ampliadas.
Surgimento de vilas e cidades → vida urbana nova.
Tropeiros ligavam regiões → formação de mercado interno.
Intendência das Minas (1702): órgão de controle e fiscalização.
Quinto: 20% de todo ouro pertencia ao Rei.
Casas de Fundição: ouro derretido e tributado — proibido ouro em pó.
Abertura dos Portos (1808): fim do monopólio → comércio livre.
Tratados de 1810: produtos ingleses mais baratos → indústria brasileira prejudicada.
1815: Brasil = Reino Unido a Portugal → deixa de ser colônia.
1821: D. João volta; D. Pedro fica no Brasil.
Jan 1822 — Dia do Fico: D. Pedro decide permanecer no Brasil.
7 Set 1822 — Independência: Grito do Ipiranga → Império do Brasil.`;
          for (let run = 0; run < 1000; run++) {
            const generated = window.nexaQuizEngine.generateQuizFromText(sample, 8);
            if (generated.length !== 8) throw new Error('Quiz test: quantidade incorreta na execução ' + run);
            if (new Set(generated.map(q => q.question)).size !== generated.length) throw new Error('Quiz test: perguntas repetidas na execução ' + run);
            for (const q of generated) {
              if (q.alternatives.length !== 4) throw new Error('Quiz test: questão sem 4 alternativas');
              if (new Set(q.alternatives.map(a => a.toLowerCase())).size !== 4) throw new Error('Quiz test: alternativas repetidas');
              if (!q.alternatives.includes(q.answer)) throw new Error('Quiz test: resposta correta ausente');
              if (q.question.length < 70) throw new Error('Quiz test: pergunta pouco detalhada');
              if (/Sobre "/.test(q.question) || /qual alternativa está de acordo com o resumo/i.test(q.question)) throw new Error('Quiz test: padrão antigo detectado');
              if (!q.explanation.includes('trecho do resumo')) throw new Error('Quiz test: explicação ausente');
            }
          }

          if (!/const bindQuizButton = \(\) =>/.test(require('fs').readFileSync('quiz-live.js', 'utf8'))) throw new Error('Quiz integration test: handler direto do botão ausente');
          if (!/reader\.close\(\)/.test(require('fs').readFileSync('quiz-live.js', 'utf8'))) throw new Error('Quiz integration test: proteção contra dialog aninhado ausente');
          const indexHtml = require('fs').readFileSync('index.html', 'utf8');
          if ((indexHtml.match(/id="aiQuizButton"/g) || []).length !== 1) throw new Error('Quiz integration test: botão ausente ou duplicado');
          if ((indexHtml.match(/id="quizDialog"/g) || []).length !== 1) throw new Error('Quiz integration test: dialog ausente ou duplicado');
          if (!/quiz-live\.js\?v=20260924-detailed-3/.test(indexHtml)) throw new Error('Quiz integration test: cache-bust incorreto');

          const samples = [
            sample,
            `A fotossíntese ocorre nos cloroplastos das células vegetais. A clorofila absorve energia luminosa e participa da produção de matéria orgânica. O gás carbônico entra nas folhas pelos estômatos. A água é absorvida principalmente pelas raízes e transportada pelo xilema. Durante o processo, oxigênio é liberado para o ambiente. A fotossíntese contribui para a cadeia alimentar porque produz matéria orgânica.`,
            `A Revolução Industrial começou na Inglaterra e envolveu a mecanização da produção. O uso de máquinas aumentou a produtividade das fábricas. O carvão mineral foi uma fonte importante de energia. A urbanização cresceu com a concentração de trabalhadores nas cidades. As condições de trabalho eram difíceis e provocaram debates sociais. Novas formas de transporte facilitaram a circulação de pessoas e mercadorias.`
          ];
          for (const textSource of samples) {
            for (let run = 0; run < 500; run++) {
              const generated = window.nexaQuizEngine.generateQuizFromText(textSource, 6);
              if (generated.length !== 6) throw new Error('Quiz multi-sample: quantidade incorreta');
              if (new Set(generated.map(q => q.question)).size !== generated.length) throw new Error('Quiz multi-sample: perguntas repetidas');
              for (const q of generated) {
                if (q.alternatives.length !== 4 || new Set(q.alternatives.map(a => a.toLowerCase())).size !== 4) throw new Error('Quiz multi-sample: alternativas inválidas');
                if (!q.alternatives.includes(q.answer)) throw new Error('Quiz multi-sample: resposta correta ausente');
                if (q.question.length < 70) throw new Error('Quiz multi-sample: pergunta curta');
                if (/Sobre "/.test(q.question) || /qual alternativa está de acordo com o resumo/i.test(q.question)) throw new Error('Quiz multi-sample: padrão antigo detectado');
                if (/qual informação completa corretamente a ideia apresentada/i.test(q.question) && q.question.includes('"este ponto"')) throw new Error('Quiz multi-sample: pergunta vaga detectada');
              }
            }
          }

          console.log('Quiz smoke tests OK:', quiz.length, 'perguntas + 1000 gerações + 1500 gerações multi-sample');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
