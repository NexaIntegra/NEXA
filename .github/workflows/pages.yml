name: Deploy NEXA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript and quiz generator
        run: |
          node --check script.js
          node --check quiz-live.js
          node --check quiz-bootstrap.js
          node - <<'NODE'
          const fs = require('fs');

          global.document = undefined;
          global.Element = class {};
          global.window = { document: null };
          require('./quiz-live.js');

          const engine = window.nexaQuizEngine;
          if (!engine || typeof engine.generateQuizFromText !== 'function') throw new Error('Quiz engine não carregou');
          if (typeof engine.generateHybridQuiz !== 'function') throw new Error('Quiz híbrido não carregou');
          if (typeof engine.shortAnswerForFact !== 'function') throw new Error('Extrator de resposta curta não carregou');

          const indexHtml = fs.readFileSync('index.html', 'utf8');
          const supabaseSource = fs.readFileSync('supabase.js', 'utf8');
          const adminHtmlSource = fs.readFileSync('admin.html', 'utf8');
          const adminJsSource = fs.readFileSync('admin.js', 'utf8');

          if ((indexHtml.match(/id="aiQuizButton"/g) || []).length !== 1) throw new Error('Botão do quiz inválido ou duplicado');
          if ((indexHtml.match(/id="quizDialog"/g) || []).length !== 1) throw new Error('Dialog do quiz inválido ou duplicado');
          if (!/quiz-live\.js\?v=20260924-fixed-2/.test(indexHtml)) throw new Error('Cache do quiz desatualizado');
          if (!/study_guide/.test(supabaseSource)) throw new Error('Supabase: estudo não integrado');
          if (!/id="examStudyGuide"/.test(adminHtmlSource)) throw new Error('Admin: campo de roteiro ausente');
          if (!/studyGuide: \$\('#examStudyGuide'\)\.value\.trim\(\)/.test(adminJsSource)) throw new Error('Admin: roteiro não é salvo');

          const samples = [
            {
              name: 'historia',
              text: `Eixo econômico mudou do Nordeste (açúcar) para o Centro-Sul (Minas Gerais).
Povoamento do interior → fronteiras ampliadas.
Surgimento de vilas e cidades → vida urbana nova.
Tropeiros ligavam regiões → formação de mercado interno.
Intendência das Minas (1702): órgão de controle e fiscalização.
Quinto: 20% de todo ouro pertencia ao Rei.
Casas de Fundição: ouro derretido e tributado — proibido ouro em pó.
Abertura dos Portos (1808): fim do monopólio → comércio livre.
Tratados de 1810: produtos ingleses mais baratos → indústria brasileira prejudicada.
1815: Brasil = Reino Unido a Portugal → deixa de ser colônia.
1821: D. João volta; D. Pedro fica no Brasil.
7 Set 1822 — Independência: Grito do Ipiranga → Império do Brasil.`,
              guide: `Mineração
Abertura dos Portos
1815
Independência`,
              count: 8
            },
            {
              name: 'biologia',
              text: `A fotossíntese ocorre nos cloroplastos das células vegetais.
A clorofila absorve energia luminosa e participa da produção de matéria orgânica.
O gás carbônico entra nas folhas pelos estômatos.
A água é absorvida principalmente pelas raízes e transportada pelo xilema.
Durante o processo, oxigênio é liberado para o ambiente.
A fotossíntese contribui para a cadeia alimentar porque produz matéria orgânica.
A respiração celular ocorre nas células e produz energia para seu funcionamento.`,
              guide: `Fotossíntese
Clorofila
Estômatos
Xilema`,
              count: 6
            },
            {
              name: 'pergunta-embutida',
              text: `Por que a Família Real veio para o Brasil?: A Família Real portuguesa deixou Portugal por causa das invasões napoleônicas.
A Abertura dos Portos permitiu o comércio com outras nações.
Os Tratados de 1810 favoreceram produtos ingleses.
A chegada da Corte provocou mudanças políticas.
O comércio colonial era controlado por Portugal.`,
              guide: `Família Real
Abertura dos Portos
Tratados de 1810`,
              count: 5
            }
          ];

          const normalize = value => String(value || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/\\s+/g, ' ').trim();
          const forbiddenQuestion = /qual alternativa está de acordo com o resumo|qual afirmação descreve corretamente|\\bSobre "/i;
          const forbiddenMeta = /boa prova|para decorar|lembre-se|memorize|ideia para decorar/i;
          const fragmentEnd = /\\b(?:de|do|da|dos|das|e|ou|para|com|por|que|como|em|no|na|nos|nas|ao|a|à)\\.?$/i;

          for (const sample of samples) {
            const facts = engine.splitFacts(sample.text);
            if (facts.length < sample.count) throw new Error(sample.name + ': fatos insuficientes');
            for (let run = 0; run < 300; run++) {
              const quiz = engine.generateHybridQuiz(sample.text, sample.guide, sample.count);
              if (quiz.length !== sample.count) throw new Error(sample.name + ': quantidade incorreta');
              if (new Set(quiz.map(q => normalize(q.question))).size !== quiz.length) throw new Error(sample.name + ': perguntas repetidas');

              for (const q of quiz) {
                if (q.alternatives.length !== 4) throw new Error(sample.name + ': 4 alternativas obrigatórias');
                if (new Set(q.alternatives.map(normalize)).size !== 4) throw new Error(sample.name + ': alternativas repetidas');
                if (!q.alternatives.some(option => normalize(option) === normalize(q.answer))) throw new Error(sample.name + ': resposta correta ausente');
                if (engine.questionLeaksAnswer(q.question, q.answer, engine.factParts(q.sourceFact).subject)) throw new Error(sample.name + ': resposta vazou na pergunta');
                if (q.alternatives.some(option => normalize(option) !== normalize(q.answer) && engine.candidateLeaksCorrectAnswer(option, q.answer))) throw new Error(sample.name + ': distrator revela a resposta');
                if (forbiddenQuestion.test(q.question)) throw new Error(sample.name + ': pergunta com formato proibido');
                if (forbiddenMeta.test(q.question) || q.alternatives.some(option => forbiddenMeta.test(option))) throw new Error(sample.name + ': texto de decoração entrou no quiz');
                if (q.alternatives.some(option => String(option).trim().length < 14 || fragmentEnd.test(String(option).trim()))) throw new Error(sample.name + ': alternativa fragmentada');
              }
            }
          }

          const embedded = engine.generateHybridQuiz(samples[2].text, samples[2].guide, 5);
          if (!embedded.some(q => /^Por que a Família Real veio para o Brasil\?$/i.test(q.question))) {
            throw new Error('Pergunta embutida não foi preservada');
          }
          if (embedded.some(q => /^Por que a:/i.test(q.question) || q.alternatives.some(option => /^Por que a:/i.test(option)))) {
            throw new Error('Fragmento de pergunta embutida apareceu no quiz');
          }

          console.log('Quiz validation OK');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
