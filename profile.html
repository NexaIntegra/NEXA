<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA | Perfil</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body"><main class="admin-main"><a href="index.html">← Voltar para a NEXA</a><section class="admin-panel" id="profile"><p class="eyebrow">PERFIL PÚBLICO</p><h1 id="name">Carregando…</h1><p id="meta"></p><div class="stat-grid"><article><span>Resumos</span><strong id="count">0</strong></article><article><span>Visualizações</span><strong id="views">0</strong></article><article><span>Média recebida</span><strong id="rating">—</strong></article></div><h2>Resumos publicados</h2><div id="list" class="summary-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="script.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id");if(!id)return;const {data:p}=await nexa.sb.from("profiles").select("id,username,created_at,status").eq("id",id).maybeSingle();if(!p||p.status==="blocked"){$("#profile").innerHTML="<h1>Perfil indisponível</h1>";return}const {data:s}=await nexa.sb.from("summaries").select("id,title,introduction,views,updated_at,ratings(score),exams(subject,title)").eq("author_id",id).eq("status","published").order("updated_at",{ascending:false});const a=s||[],all=a.flatMap(x=>x.ratings||[]);const avg=all.length?all.reduce((n,r)=>n+r.score,0)/all.length:0;$("#name").textContent=p.username;$("#meta").textContent="Membro desde "+new Date(p.created_at).toLocaleDateString("pt-BR");$("#count").textContent=a.length;$("#views").textContent=a.reduce((n,x)=>n+(x.views||0),0);$("#rating").textContent=avg?avg.toFixed(1)+" / 5":"Sem avaliações";$("#list").innerHTML=a.map(x=>`<article class="summary-card preview-card"><div class="summary-details"><h3>${nexa.esc(x.title)}</h3><p>${nexa.esc(x.introduction||"")}</p><small>${nexa.esc(x.exams?.subject||"")} · 👁 ${x.views||0}</small></div><button class="outline-button open-summary" data-id="${x.id}">Abrir resumo →</button></article>`).join("")||"<div class='empty'>Nenhum resumo publicado.</div>";})();</script></body></html>
