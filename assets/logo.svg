<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA Logo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
        }

        .svg-container {
            width: 90%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            
            <!-- 1. Right vertical stem (background) -->
            <path d="M 480,160 L 560,160 L 560,360 A 40,40 0 0,1 480,360 Z" fill="#6a9bf4" />
            
            <!-- 2. Main N ribbon (left stem and diagonal) -->
            <path d="M 280,360 L 280,200 L 520,360" stroke="#82b1ff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            
            <!-- 3. Graduation cap base -->
            <polygon points="475,135 565,135 550,160 490,160" fill="#82b1ff" />
            
            <!-- 4. Graduation cap diamond top -->
            <polygon points="520,80 605,115 520,150 435,115" fill="#82b1ff" />
            
            <!-- 5. Tassel string -->
            <line x1="585" y1="128" x2="585" y2="170" stroke="#82b1ff" stroke-width="6" stroke-linecap="round" />
            
            <!-- 6. Tassel teardrop -->
            <circle cx="585" cy="177" r="7" fill="#82b1ff" />
            
            <!-- 7. The text 'NEXA' below the logo -->
            <g stroke="#82b1ff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <!-- N -->
                <path d="M 225,510 L 225,440 L 285,510 L 285,440" />
                <!-- E -->
                <path d="M 370,440 L 325,440 L 325,510 L 370,510 M 325,475 L 355,475" />
                <!-- X -->
                <path d="M 415,440 L 475,510 M 475,440 L 415,510" />
                <!-- A -->
                <path d="M 515,510 L 545,440 L 575,510 M 527,485 L 563,485" />
            </g>
            
        </svg>
    </div>
</body>
</html>
