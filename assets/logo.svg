<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA Logo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Clean white background */
            font-family: sans-serif;
        }

        .logo-container {
            width: 100%;
            max-width: 600px; /* Scalable vector container */
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Subtle gradient for the 3D folded shadow effect on the N -->
                <linearGradient id="foldShadow" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="rgba(0, 0, 0, 0.12)" />
                    <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
                </linearGradient>
            </defs>

            <g id="big-n" fill="#84b6f4">
                
                <!-- Right Leg: Flat top to hold the cap, extending down -->
                <path d="M 420 135 L 500 135 L 500 310 A 40 40 0 0 1 420 310 Z" />
                
                <!-- Fold Shadow: Placed precisely on the right leg, fading upwards -->
                <!-- The diagonal overlaps it and hides the bottom edge -->
                <polygon points="420,242 500,290 500,200 420,152" fill="url(#foldShadow)" />

                <!-- Left Leg: Rounded bottom, flat top merging perfectly into the diagonal -->
                <path d="M 220 190 L 300 190 L 300 310 A 40 40 0 0 1 220 310 Z" />

                <!-- Diagonal Ribbon: Uses round caps to create perfect top-left and bottom-right corners -->
                <line x1="260" y1="190" x2="460" y2="310" stroke="#84b6f4" stroke-width="80" stroke-linecap="round" />
            </g>

            <g id="graduation-cap">
                <!-- Diamond Mortarboard: Sits on the right leg, uses a white stroke to create a negative space cutout -->
                <polygon points="460,75 530,110 460,145 390,110" fill="#84b6f4" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
                
                <!-- Tassel string hanging from the right tip -->
                <line x1="520" y1="105" x2="520" y2="155" stroke="#84b6f4" stroke-width="4" stroke-linecap="round" />
                
                <!-- Tassel Teardrop Bead -->
                <g id="tassel-bead" fill="#84b6f4">
                    <circle cx="520" cy="162" r="4" />
                    <polygon points="520,150 516,162 524,162" />
                </g>
            </g>

            <!-- The text is rendered as geometric paths to perfectly match the rounded logo font -->
            <g id="nexa-text" stroke="#84b6f4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
                
                <!-- N -->
                <!-- Path draws up, diagonal down, then up to ensure correct line joints -->
                <path d="M 240 480 L 240 420 L 290 480 L 290 420" />
                
                <!-- E -->
                <!-- Draws the spine and outer horizontal bars, then adds the middle bar -->
                <path d="M 380 420 L 330 420 L 330 480 L 380 480 M 330 450 L 370 450" />
                
                <!-- X -->
                <path d="M 420 420 L 470 480 M 470 420 L 420 480" />
                
                <!-- A -->
                <!-- Simple inverted V without a crossbar, matching the logo -->
                <path d="M 510 480 L 535 420 L 560 480" />

            </g>
        </svg>
    </div>

</body>
</html>
